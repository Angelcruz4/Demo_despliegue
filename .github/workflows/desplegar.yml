name: Comprobar script y preparar version
"on":
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.2'
          coverage: none

      - name: Ejecutar scripts
        shell: pwsh
        run: .\desplegar.ps1 -RutaPHP 'php' -NoIniciarServidor

      - name: Guardar version preparada
        uses: actions/upload-artifact@v4
        with:
          name: version-preparada
          path: Pruebas/index.php
          if-no-files-found: error